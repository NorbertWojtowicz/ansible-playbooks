---
- name: Install MySQL and dependencies
  ansible.builtin.apt:
    name: "{{item}}"
    state: present
    update_cache: yes
  loop:
    - mysql-server
    - mysql-client
    - python3-pymysql
    - libmysqlclient-dev
    - libmariadb-java

- name: Start and enable mysql service
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

- name: Edit bind-address in config file
  ansible.builtin.lineinfile:
    path: "/etc/mysql/mysql.conf.d/mysqld.cnf"
    regexp: "^bind-address"
    line: "bind-address = 0.0.0.0"
    backrefs: yes
  notify: Restart MySQL

- name: Create MySQL user for Airflow
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ gv_airflowdb_user }}"
    password: "{{ gv_airflowdb_password }}"
    host: "%"
    priv: "airflow.*:ALL,GRANT"
    column_case_sensitive: true
    state: present

- name: Create MySQL user for Hive Metastore
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ gv_hmsdb_user }}"
    password: "{{ gv_hmsdb_password }}"
    host: "%"
    priv: "metastore.*:ALL,GRANT"
    column_case_sensitive: true
    state: present
